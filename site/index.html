<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캡슐체스 · Capsule Chess · カプセルチェス</title>
  <style>
    :root { --ink: #2E2A3A; --soft: #6E6878; --sky: #E4F3FF; --sun: #FFD23F; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--sky); color: var(--ink); font: 16px/1.7 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Hiragino Sans", "Yu Gothic", sans-serif; word-break: keep-all; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    img.feature { width: 100%; height: auto; border: 3px solid var(--ink); border-bottom-width: 7px; border-radius: 20px; display: block; }
    .shots { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
    .shots img { width: 160px; height: auto; border: 3px solid var(--ink); border-radius: 18px; flex: none; }
    .card { background: #fff; border: 3px solid var(--ink); border-bottom-width: 6px; border-radius: 18px; padding: 14px 18px; margin: 16px 0; }
    h1 { font-size: 26px; margin: 24px 0 4px; }
    h2 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 4px 0; }
    a.button { display: inline-block; background: var(--sun); color: var(--ink); border: 3px solid var(--ink); border-bottom-width: 6px; border-radius: 16px; padding: 6px 16px; font-weight: 700; text-decoration: none; margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <img class="feature" src="../assets/store/feature-ko.png" alt="캡슐체스">
  <h1>캡슐체스 · Capsule Chess · カプセルチェス</h1>
  <p>귀여운 몬스터와 3분 미니 체스. 5×5 판에서 캡슐 리그, 오늘의 퍼즐, 퍼즐 도장을 즐겨요.</p>
  <p>Cute monster mini chess in 3 minutes on a 5×5 board.</p>
  <p>かわいいモンスターと3分で遊べる5×5のミニチェス。</p>

  <div class="shots">
    <img src="../assets/store/screenshots/ko/01-home.png" alt="">
    <img src="../assets/store/screenshots/ko/03-versus.png" alt="">
    <img src="../assets/store/screenshots/ko/02-battle.png" alt="">
    <img src="../assets/store/screenshots/ko/05-evolution.png" alt="">
  </div>

  <div class="card">
    <h2>개인정보처리방침 · Privacy · プライバシー</h2>
    <p>개인정보를 수집하지 않고, 기록은 기기 안에만 저장돼요.</p>
    <a class="button" href="privacy/">개인정보처리방침 보기 · Read the policy</a>
  </div>
</main>

</html>
